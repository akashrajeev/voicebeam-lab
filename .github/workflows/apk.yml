name: ENH-6-SEP-9-apk
# SEP-9 (causal SkiM) ported onto revised UI + consent + captions. Separation OFF by default, raw fallback. Host-tested only, phone pending.
on:
  push:
    branches: [sep9-revised-ui-2026-10-11]
    paths: ['.github/workflows/apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch models and sherpa-onnx library
        run: bash scripts/fetch_models.sh
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -Dorg.gradle.jvmargs="-Xmx4g"
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx4g"
      - name: Show APK
        run: |
          ls -la app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk
          grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBeam-ENH-6-SEP-9
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 3
